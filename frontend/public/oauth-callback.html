<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with GitHub...</title>
</head>
<body style="background: #030712; color: #f3f4f6; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h3 style="margin-bottom: 8px;">Connecting to GitHub</h3>
    <p style="color: #9ca3af; font-size: 14px;">Completing authentication, please wait...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    
    if (code) {
      window.opener.postMessage({ type: 'GITHUB_OAUTH_CODE', code, state }, window.location.origin);
    } else {
      window.opener.postMessage({ type: 'GITHUB_OAUTH_ERROR', error: params.get('error_description') || 'OAuth authentication failed.' }, window.location.origin);
    }
    window.close();
  </script>
</body>
</html>
